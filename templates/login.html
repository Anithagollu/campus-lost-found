<!DOCTYPE html>
<html>
<head>
    <title>Login - Campus Lost & Found</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🔐 Login</h1>

    <p class="welcome">
        Login to your Campus Lost & Found account
    </p>


    <form action="/login" method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <br><br>


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <br><br>


        <button type="submit">
            🔐 Login
        </button>

    </form>


    <br>


    <p>
        Don't have an account?

        <a href="/register">
            Register here
        </a>
    </p>


    <br>


    <a href="/">
        <button>
            🏠 Back to Home
        </button>
    </a>

</div>

</body>
</html>
